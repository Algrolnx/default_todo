{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History - FocusList</title>
    <link rel="stylesheet" href="{% static 'tasks/style.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">

        <header>
            <div class="logo">
                <h1>History</h1>
            </div>
            <a href="{% url 'tasks:index' %}" class="back-link">Back</a>
        </header>

        <main class="history-list">
            {% for entry in entries %}
            <div class="history-entry action-{{ entry.action }}">
                <div class="history-left">
                    <span class="history-action">{{ entry.get_action_display }}</span>
                    <span class="history-title">{{ entry.task_title }}</span>
                </div>
                <span class="history-time">{{ entry.timestamp|date:"d.m.Y H:i" }}</span>
            </div>
            {% empty %}
            <div class="empty-state">
                <p>No history yet.</p>
            </div>
            {% endfor %}
        </main>

    </div>
</body>

</html>
